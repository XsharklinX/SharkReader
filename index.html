<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shark Reader PC</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@500;700;800&family=Roboto+Slab:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="theme-dark">

    <div id="shark-preloader" aria-live="polite">
        <div class="preloader-minimal">
            <div class="preloader-minimal-mark">SR</div>
            <div class="preloader-minimal-copy">
                <span class="preloader-minimal-title">Shark Reader</span>
                <span class="preloader-minimal-subtitle">Cargando biblioteca</span>
            </div>
            <div class="preloader-minimal-bar">
                <span></span>
            </div>
        </div>
    </div>

    <div id="root"></div>

    <script>
        window.__hideSharkPreloader = function () {
            const loader = document.getElementById('shark-preloader');
            if (!loader || loader.dataset.hidden === 'true') return;
            loader.dataset.hidden = 'true';
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.visibility = 'hidden';
                loader.style.pointerEvents = 'none';
                loader.style.display = 'none';
                if (loader.parentNode) loader.parentNode.removeChild(loader);
            }, 140);
        };
        window.addEventListener('error', () => window.__hideSharkPreloader());
        setTimeout(() => window.__hideSharkPreloader(), 1200);
    </script>

    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
